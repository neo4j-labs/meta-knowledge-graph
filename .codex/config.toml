[mcp_servers.meta-knowledge-graph]
args = [
    "run",
    "--no-sync",
    "meta-knowledge-graph",
]
command = "uv"
# Tells MKG which signed-in harness account to read the user id from when
# MKG_USER_ID is not set explicitly.
env = { MKG_CLIENT = "codex" }

[mcp_servers.meta-knowledge-graph.tools.bigquery_execute_query]
approval_mode = "approve"

[mcp_servers.meta-knowledge-graph.tools.project_add_learning]
approval_mode = "approve"

[mcp_servers.meta-knowledge-graph.tools.neocarta_list_tables_by_schema]
approval_mode = "approve"

[mcp_servers.meta-knowledge-graph.tools.neocarta_get_context_by_table_hybrid_search]
approval_mode = "approve"
